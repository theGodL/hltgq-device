# ==================== video alert patrol (camera fault detection & alert) ====================
# master switch of the patrol job
video-alert.enabled=true
# patrol cron (every 30 min, offset 5 min from the hourly station sync job)
video-alert.cron=0 5,35 * * * ?
# concurrent channels inspected per round
video-alert.parallel=4
# frames grabbed per channel by ffmpeg (3~5 recommended)
video-alert.frames=3
# single channel overall time limit in seconds (stream probe + grab + analyze)
video-alert.stream-seconds=15
# ffmpeg grab hard timeout in seconds (process killed on timeout)
video-alert.grab-timeout-seconds=15
# debounce: consecutive abnormal rounds to raise a new alert
video-alert.detect-threshold=2
# debounce: consecutive normal rounds to close the alert (recovered)
video-alert.recover-threshold=2
# patrol stats window in minutes (keep in sync with video-alert.cron interval)
video-alert.patrol-window-minutes=30
# patrol stats query range limit in days (keep in sync with hltgq-mq 730-day limit, see 数据统计.md 4.4)
video-alert.stats-max-range-days=730
# optional alert level override map: FAULT_NAME:#1#|#2#|#3#|#4#, comma separated; empty = use enum defaults
# e.g. video-alert.level-map=SIGNAL_LOSS:#3#,BLUR:#2#
video-alert.level-map=
# video device name suffix: device name = {station name}{suffix}#, same naming style as hltgq-mq
# (\uXXXX escaped: properties are decoded as ISO-8859-1 by Spring Boot, raw Chinese would be garbled)
video-alert.device-suffix=\u6444\u50cf\u673a
# ffmpeg frame downscale width for analysis (0 = no scaling; B-layer metrics are resolution-insensitive)
video-alert.frame-scale-width=320
# station info cache TTL in seconds (station name may be manually edited, refresh soon after change)
video-alert.site-cache-ttl-seconds=600
# B-layer image quality thresholds (defaults calibrated on sub-stream D1/CIF + 320px downscale frames);
# tune on-site by actual post-downscale statistics to adapt to camera resolution differences
video-alert.threshold.too-dark-mean=25.0
video-alert.threshold.too-bright-mean=205.0
video-alert.threshold.dark-pixel-ratio=0.70
video-alert.threshold.bright-pixel-ratio=0.70
video-alert.threshold.color-cast-delta=40.0
video-alert.threshold.grayscale-saturation=12.0
video-alert.threshold.contrast-std-dev=18.0
video-alert.threshold.blur-laplacian-var=150.0
video-alert.threshold.noise-residual=12.0

